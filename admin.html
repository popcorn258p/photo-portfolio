<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台 · Robert Yen Photo Portfolio</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#F5F0E8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">ROBERT YEN · 後台</a>
    <nav class="nav">
      <a href="index.html">回前台</a>
      <button type="button" id="logoutBtn" class="btn btn-ghost btn-sm">登出</button>
    </nav>
  </header>

  <div class="admin-wrap">
    <p id="configHint" class="admin-hint"></p>
    <p id="adminError" class="admin-error" role="alert"></p>

    <!-- Login -->
    <section id="loginPanel" class="admin-panel login-box">
      <h1 style="font-family: var(--font-display); font-size: 1.4rem; margin: 0 0 0.5rem;">後台登入</h1>
      <p class="admin-hint">使用 Supabase → Authentication → Users 建立的 Email / 密碼（不是 GitHub 密碼）</p>
      <p class="admin-hint">若上線後登不進去：請確認 Email 登入已開啟、使用者有勾 Auto Confirm。詳見教學文件。</p>
      <form id="loginForm" style="display:grid;gap:0.85rem;margin-top:1rem;">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">密碼</label>
          <input id="password" type="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary">登入</button>
      </form>
    </section>

    <!-- Dashboard -->
    <div id="dashPanel" hidden>
      <div class="admin-header">
        <h1>作品管理</h1>
        <span class="badge">後台網址請自行收藏，勿公開分享</span>
      </div>
      <p class="admin-hint" style="margin-top:-0.75rem;margin-bottom:1rem;">
        版型說明：正方形 / 直式 / 橫式 / 主視覺（大圖）。混搭使用會更像雜誌排版。
      </p>

      <section class="admin-panel">
        <h2 id="formTitle">新增作品</h2>
        <form id="photoForm">
          <div class="admin-grid">
            <div class="field">
              <label for="title">標題 *</label>
              <input id="title" name="title" type="text" required />
            </div>
            <div class="field">
              <label for="category_id">分類 *</label>
              <select id="category_id" name="category_id" required></select>
            </div>
            <div class="field">
              <label for="album">相簿 / 專案名</label>
              <input id="album" name="album" type="text" placeholder="例如：2025 上高地" />
            </div>
            <div class="field">
              <label for="sort_order">排序（數字越小越前）</label>
              <input id="sort_order" name="sort_order" type="number" value="100" />
            </div>
            <div class="field">
              <label for="layout_style">版型（雜誌編排）</label>
              <select id="layout_style" name="layout_style">
                <option value="square">正方形</option>
                <option value="portrait" selected>直式</option>
                <option value="landscape">橫式</option>
                <option value="feature">主視覺（大）</option>
              </select>
            </div>
            <div class="field full">
              <label for="description">說明（可選）</label>
              <textarea id="description" name="description" rows="2"></textarea>
            </div>
            <div class="field full">
              <label for="image_file">上傳圖片到 Supabase Storage</label>
              <input id="image_file" name="image_file" type="file" accept="image/*" />
            </div>
            <div class="field full">
              <label for="image_url">或填外連網址（Flickr 直連圖）</label>
              <input id="image_url" name="image_url" type="url" placeholder="https://live.staticflickr.com/..." />
            </div>
            <div class="field full">
              <label for="flickr_url">Flickr 作品頁（可選）</label>
              <input id="flickr_url" name="flickr_url" type="url" placeholder="https://www.flickr.com/photos/robert_yen/..." />
            </div>
            <div class="field">
              <label>
                <input id="is_published" name="is_published" type="checkbox" checked />
                上架顯示於前台
              </label>
            </div>
          </div>
          <div class="admin-actions">
            <button type="submit" class="btn btn-primary">儲存</button>
            <button type="button" id="resetFormBtn" class="btn btn-ghost">清除表單</button>
          </div>
          <p id="formStatus" class="form-status" role="status"></p>
        </form>
      </section>

      <section class="admin-panel">
        <h2>作品列表</h2>
        <div style="overflow-x:auto;">
          <table class="photo-table">
            <thead>
              <tr>
                <th>圖</th>
                <th>標題</th>
                <th>分類</th>
                <th class="hide-sm">版型</th>
                <th class="hide-sm">排序</th>
                <th>狀態</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="photoTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <footer class="site-footer">
    <p>© <span id="year"></span> Admin · 請勿公開 service_role key</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
